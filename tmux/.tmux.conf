# --- Tmux Configuration ---

# Change prefix from Ctrl-b to Ctrl-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Use vi keys in copy mode (hjkl for movement)
setw -g mode-keys vi

# hjkl pane traversal (with prefix)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# hjkl pane resizing (Prefix + Shift + hjkl)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
# --- Mouse & Scroll Support ---
set -g mouse on
# Scroll 1 line at a time instead of 5
bind -T copy-mode-vi WheelUpPane send-keys -X scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X scroll-down

# --- Clipboard & Copy Mode (macOS) ---
set -g set-clipboard on
# Use 'v' to begin selection (like Vim)
bind-key -T copy-mode-vi v send-keys -X begin-selection
# Use 'y' to copy selection (like Vim)
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
# Also copy on Enter
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

# Drag to copy but DON'T exit copy mode or jump to bottom
unbind -T copy-mode-vi MouseDragEnd1Pane
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "pbcopy"

# Double click to select word and copy
bind-key -T copy-mode-vi DoubleClick1Pane \
    select-pane \; \
    send-keys -X select-word \; \
    run-shell "sleep 0.1" \; \
    send-keys -X copy-pipe-and-cancel "pbcopy"

# Triple click to select line and copy
bind-key -T copy-mode-vi TripleClick1Pane \
    select-pane \; \
    send-keys -X select-line \; \
    run-shell "sleep 0.1" \; \
    send-keys -X copy-pipe-and-cancel "pbcopy"

# --- Status Bar Appearance ---
set -g status-style bg=white,fg=black

# --- Seamless Vim-Tmux Navigation ---
# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{client_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# --- Custom Workspace & Popup Binds ---

# 3-Pane Dev Workspace Layout (Prefix + Shift + W)
# Left 40% (Claude), Right 60% (split into Top 70% Neovim, Bottom 30% Logs/Terminal)
bind W new-window -n dev \; \
       split-window -h -p 60 \; \
       split-window -v -p 30 \; \
       select-pane -t 0 \; \
       send-keys "claude" C-m \; \
       select-pane -t 1 \; \
       send-keys "vi" C-m \; \
       select-pane -t 2 \; \
       send-keys "clear" C-m

# Floating popups for Yazi (Prefix + e) and Lazygit (Prefix + g)
# Opens in the current pane's directory (-d "#{pane_current_path}")
bind e display-popup -w 90% -h 90% -d "#{pane_current_path}" -E "yazi"
bind g display-popup -w 90% -h 90% -d "#{pane_current_path}" -E "lazygit"

# --- TPM (Tmux Plugin Manager) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Keep this line at the very bottom of tmux.conf
run '~/.tmux/plugins/tpm/tpm'
